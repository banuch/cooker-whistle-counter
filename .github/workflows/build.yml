name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders
        run: bash setup.sh

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build release APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log

      - name: Report build error
        if: failure()
        run: |
          msg=$(grep -E -A8 "What went wrong|error:|Error:|FAILURE" build.log | head -60 || tail -40 build.log)
          [ -z "$msg" ] && msg=$(tail -40 build.log)
          msg="${msg//'%'/'%25'}"; msg="${msg//$'\n'/'%0A'}"
          echo "::error title=APK build failed::$msg"

      - uses: actions/upload-artifact@v4
        with:
          name: cooker-whistle-counter-apk
          path: build/app/outputs/flutter-apk/app-release.apk
